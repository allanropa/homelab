services:
  db:
    image: postgres:16-alpine
    env_file:
      - /etc/homelab/secrets/expenses.env
    volumes:
      - /srv/homelab/expenses/postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-expenses} -d ${POSTGRES_DB:-expenses}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ${BACKEND_CONTEXT:-.}
    env_file:
      - /etc/homelab/secrets/expenses.env
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    networks:
      - default
      - cloudflared

  frontend:
    build:
      context: ${FRONTEND_CONTEXT:-.}
    depends_on:
      - backend
    expose:
      - "80"
    ports:
      - "127.0.0.1:5173:80"
    networks:
      - cloudflared

networks:
  default:
  cloudflared:
    external: true
    name: cloudflared
