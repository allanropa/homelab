services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    volumes:
      - /srv/homelab/hermes:/opt/data
      - ./managed/config.yaml:/etc/hermes/config.yaml:ro
      - ./managed/gitconfig:/etc/hermes/gitconfig:ro
      - /root/repos:/workspace/repos
    environment:
      GIT_CONFIG_GLOBAL: /etc/hermes/gitconfig

    env_file:
      - /etc/homelab/secrets/hermes.env
    ports:
      - "127.0.0.1:8642:8642"
      - "127.0.0.1:9119:9119"

    mem_limit: 2g
    cpus: 2
    networks:
      - default
      - silverbullet_connector
      - guild_wars_2_connector
      - imap_connector
      - openwebui_connector

networks:
  silverbullet_connector:
    external: true
    name: hermes_silverbullet_connector
  guild_wars_2_connector:
    name: hermes_guild_wars_2_connector
  imap_connector:
    name: hermes_imap_connector
  openwebui_connector:
    name: hermes_openwebui_connector
