name: media-stack

services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    hostname: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Bogota
    volumes:
      - /srv/homelab/media/prowlarr:/config
    ports:
      - "9696:9696"
    restart: unless-stopped
    networks:
      - arr

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    hostname: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Bogota
    volumes:
      - /srv/homelab/media/sonarr:/config
      - /root/storage/downloads:/downloads
      - /root/storage/media/tv:/tv
    ports:
      - "8989:8989"
    restart: unless-stopped
    networks:
      - arr

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    hostname: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Bogota
    volumes:
      - /srv/homelab/media/radarr:/config
      - /root/storage/downloads:/downloads
      - /root/storage/media/movies:/movies
    ports:
      - "7878:7878"
    restart: unless-stopped
    networks:
      - arr

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    hostname: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Bogota
      - WEBUI_PORT=8090
      - TORRENTING_PORT=6881
    volumes:
      - /srv/homelab/media/qbittorrent:/config
      - /root/storage/downloads:/downloads
    ports:
      - "8090:8090"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped
    networks:
      - arr

  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    hostname: jellyfin
    volumes:
      - /srv/homelab/media/jellyfin:/config
      - /srv/homelab/media/jellyfin-cache:/cache
      - /root/storage/media/tv:/media/tv:ro
      - /root/storage/media/movies:/media/movies:ro
    ports:
      - "8096:8096/tcp"
      - "7359:7359/udp"
    restart: unless-stopped
    networks:
      - arr

networks:
  arr:
    driver: bridge
