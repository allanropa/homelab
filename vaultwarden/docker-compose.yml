version: '3'
services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    env_file:
      - path: /etc/homelab/secrets/vaultwarden.env
        required: true
    volumes:
      - /srv/homelab/vaultwarden:/data
    ports:
      - "8080:80"
